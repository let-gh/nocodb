# Auto-merge the weekly agent-quality review's KNOWN-ISSUES / insights PRs (Miki, 2026-10-28).
#
# The routine opens one PR per repo on branch quality-review/<date>. Most sat unmerged, so the agents
# never learned from them. This merges a review PR ONLY when a fixed script — not the model — proves it is
# the kind the routine is allowed to make:
#   - branch quality-review/... and NOT ...-code (code / SKILL.md proposals always wait for Miki);
#   - files: *KNOWN-ISSUES.md, insights/*.md, .claude-plugin/plugin.json — nothing else, nothing deleted;
#   - the .md changes only ADD lines;
#   - plugin.json: exactly the "version" line, a patch bump (x.y.z -> x.y.z+1);
#   - KNOWN-ISSUES additions: at most 80 lines, no URL, no email address (agents read these files —
#     this is the guard against data from a log "teaching" them something).
# Anything else: a comment on the PR saying why, and it waits for Miki. Identical file in every agent repo.
name: review-automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-merge:
    if: startsWith(github.head_ref, 'quality-review/') && !endsWith(github.head_ref, '-code') && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check the PR is a pure review PR
        id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          base, head = os.environ["BASE"], os.environ["HEAD"]
          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True, check=True).stdout
          problems = []
          known_added = 0
          for line in git("diff", "--name-status", f"{base}...{head}").splitlines():
              status, path = line.split("\t", 1)
              ok_path = path.endswith("KNOWN-ISSUES.md") or re.fullmatch(r"insights/[^/]+\.md", path) or path == ".claude-plugin/plugin.json"
              if not ok_path:
                  problems.append(f"{path}: not a file the review may change")
                  continue
              if status not in ("A", "M"):
                  problems.append(f"{path}: status {status} (only add or modify)")
                  continue
              diff = git("diff", "-U0", f"{base}...{head}", "--", path).replace("\r", "")
              removed = [l for l in diff.splitlines() if l.startswith("-") and not l.startswith("---")]
              added = [l[1:] for l in diff.splitlines() if l.startswith("+") and not l.startswith("+++")]
              if path == ".claude-plugin/plugin.json":
                  if len(removed) != 1 or len(added) != 1:
                      problems.append("plugin.json: must change exactly one line, the version")
                      continue
                  old = re.fullmatch(r'\s*"version":\s*"(\d+)\.(\d+)\.(\d+)",?\s*', removed[0][1:])
                  new = re.fullmatch(r'\s*"version":\s*"(\d+)\.(\d+)\.(\d+)",?\s*', added[0])
                  if not (old and new and old.group(1, 2) == new.group(1, 2) and int(new.group(3)) == int(old.group(3)) + 1):
                      problems.append("plugin.json: only a patch bump (x.y.z -> x.y.z+1) is allowed")
                  continue
              if removed:
                  problems.append(f"{path}: {len(removed)} line(s) removed or rewritten (additive only)")
              if path.endswith("KNOWN-ISSUES.md"):
                  known_added += len(added)
                  for text in added:
                      if re.search(r"https?://|www\.", text, re.I):
                          problems.append(f"{path}: an added line contains a URL")
                      if re.search(r"[\w.+-]+@[\w-]+\.[\w.]+", text):
                          problems.append(f"{path}: an added line contains an email address")
          if known_added > 80:
              problems.append(f"KNOWN-ISSUES additions: {known_added} lines (max 80)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"ok={'true' if not problems else 'false'}\n")
          with open("problems.md", "w") as out:
              out.write("\n".join(f"- {p}" for p in sorted(set(problems))))
          print("\n".join(problems) or "pure review PR")
          PY

      - name: Merge
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --merge --delete-branch

      - name: Explain why it waits for Miki
        if: steps.check.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Not auto-merged — this review PR needs Miki:"; echo; cat problems.md; } > body.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file body.md
